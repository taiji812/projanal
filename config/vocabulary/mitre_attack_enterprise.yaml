# MITRE ATT&CK Enterprise - Tactics and Techniques
# Source: https://attack.mitre.org/ (v15)

tactics:
  - id: TA0001
    name: Initial Access
    description: Techniques to gain an initial foothold within a network
  - id: TA0002
    name: Execution
    description: Techniques that run adversary-controlled code on a local or remote system
  - id: TA0003
    name: Persistence
    description: Techniques to maintain foothold across system restarts, credential changes, and other interruptions
  - id: TA0004
    name: Privilege Escalation
    description: Techniques to gain higher-level permissions on a system or network
  - id: TA0005
    name: Defense Evasion
    description: Techniques to avoid detection throughout the compromise
  - id: TA0006
    name: Credential Access
    description: Techniques for stealing credentials like account names and passwords
  - id: TA0007
    name: Discovery
    description: Techniques to gain knowledge about the system and internal network
  - id: TA0008
    name: Lateral Movement
    description: Techniques to enter and control remote systems on a network
  - id: TA0009
    name: Collection
    description: Techniques to gather information relevant to the adversary's goal
  - id: TA0010
    name: Exfiltration
    description: Techniques to steal data from a network
  - id: TA0011
    name: Command and Control
    description: Techniques to communicate with compromised systems to control them
  - id: TA0040
    name: Impact
    description: Techniques to disrupt availability or compromise integrity by manipulating business and operational processes
  - id: TA0042
    name: Resource Development
    description: Techniques to establish resources to support operations
  - id: TA0043
    name: Reconnaissance
    description: Techniques to gather information before compromising a target

